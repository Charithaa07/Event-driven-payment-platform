spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

security:
  jwt:
    issuer: ${JWT_ISSUER_URI:https://auth.example.com/}
    audience: ${JWT_AUDIENCE:payment-api}
    jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/oauth2/jwks}

idempotency:
  redis:
    ttl-hours: ${IDEMPOTENCY_REDIS_TTL_HOURS:24}

outbox:
  relay:
    enabled: ${OUTBOX_RELAY_ENABLED:true}
    fixed-delay-ms: ${OUTBOX_RELAY_FIXED_DELAY_MS:1000}
    publish-timeout-ms: ${OUTBOX_RELAY_PUBLISH_TIMEOUT_MS:10000}
    max-attempts: ${OUTBOX_RELAY_MAX_ATTEMPTS:10}
    retry-base-ms: ${OUTBOX_RELAY_RETRY_BASE_MS:1000}
    retry-max-ms: ${OUTBOX_RELAY_RETRY_MAX_MS:60000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

server:
  port: ${PORT:8080}
