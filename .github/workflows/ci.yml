name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate observability and performance configuration
        run: |
          docker compose --profile observability config >/dev/null
          python -m json.tool observability/grafana/dashboards/payment-platform.json >/dev/null
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "$PWD/observability/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            -v "$PWD/performance/k6:/scripts:ro" \
            grafana/k6:2.2.0 inspect /scripts/payment-api.js >/dev/null
          docker run --rm \
            -v "$PWD/performance/k6:/scripts:ro" \
            grafana/k6:2.2.0 inspect /scripts/idempotency-hot-key.js >/dev/null
          bash -n performance/resilience/redis-fail-open.sh
          bash -n performance/resilience/kafka-outage-outbox-recovery.sh

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2

      - name: Validate AWS Terraform
        run: |
          terraform -chdir=deploy/aws/terraform fmt -check -diff -recursive
          terraform -chdir=deploy/aws/terraform init -backend=false -input=false
          terraform -chdir=deploy/aws/terraform validate

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate Helm deployment
        run: |
          helm lint deploy/helm/payment-platform
          helm template payment-platform deploy/helm/payment-platform --namespace payments > /tmp/payment-platform.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/payment-platform.yaml)" -eq 4
          test "$(grep -c '^kind: Service$' /tmp/payment-platform.yaml)" -eq 4
          test "$(grep -c '^kind: HorizontalPodAutoscaler$' /tmp/payment-platform.yaml)" -eq 4
          test "$(grep -c '^kind: PodDisruptionBudget$' /tmp/payment-platform.yaml)" -eq 4
          test "$(grep -c '^kind: ServiceAccount$' /tmp/payment-platform.yaml)" -eq 4

          helm template payment-platform deploy/helm/payment-platform \
            --namespace payments \
            -f deploy/helm/payment-platform/values-aws.yaml > /tmp/payment-platform-aws.yaml
          test "$(grep -c '^kind: Deployment$' /tmp/payment-platform-aws.yaml)" -eq 4
          grep -q 'AWS_MSK_IAM' /tmp/payment-platform-aws.yaml
          grep -q 'SPRING_DATA_REDIS_SSL_ENABLED' /tmp/payment-platform-aws.yaml
          grep -q 'serviceAccountName: payment-platform-payment' /tmp/payment-platform-aws.yaml

      - name: Scan secrets and infrastructure
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.74.0 \
            fs --scanners secret --exit-code 1 /workspace

          docker run --rm \
            -v "$PWD:/workspace" \
            aquasec/trivy:0.74.0 \
            config --severity HIGH,CRITICAL --exit-code 1 /workspace/deploy

      - name: Run tests and package services
        run: mvn --batch-mode verify

      - name: Scan Java dependencies
        run: |
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$HOME/.m2:/root/.m2:ro" \
            aquasec/trivy:0.74.0 \
            fs --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
            --skip-dirs /workspace/deploy/aws/terraform/.terraform \
            /workspace

      - name: Build runtime images
        run: |
          while IFS=: read -r service port; do
            jar_file=$(find "$service/target" -maxdepth 1 -type f -name "$service-*.jar" ! -name "*.original" | head -n 1)
            test -n "$jar_file"
            docker build \
              --build-arg JAR_FILE="$jar_file" \
              --build-arg SERVICE_PORT="$port" \
              -t "payment-platform/$service:ci" .
          done <<'EOF'
          payment-service:8080
          transaction-service:8081
          audit-service:8082
          notification-service:8083
          EOF

      - name: Scan runtime images
        run: |
          for service in payment-service transaction-service audit-service notification-service; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.74.0 \
              image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              "payment-platform/$service:ci"
          done

      - name: Generate CycloneDX SBOMs
        run: |
          mkdir -p artifacts/sbom
          for service in payment-service transaction-service audit-service notification-service; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/artifacts/sbom:/output" \
              anchore/syft:v1.51.1 \
              "payment-platform/$service:ci" \
              -o "cyclonedx-json=/output/$service.cdx.json"
          done

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sboms
          path: artifacts/sbom/*.cdx.json
          if-no-files-found: error
          retention-days: 30
