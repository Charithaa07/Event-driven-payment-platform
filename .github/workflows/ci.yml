name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Validate observability configuration
        run: |
          docker compose --profile observability config >/dev/null
          python -m json.tool observability/grafana/dashboards/payment-platform.json >/dev/null
      - name: Run tests
        run: mvn --batch-mode test
