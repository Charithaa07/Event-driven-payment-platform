version: 2

updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    groups:
      maven-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:15"
      timezone: "UTC"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: "UTC"
    open-pull-requests-limit: 5

  - package-ecosystem: terraform
    directory: "/deploy/aws/terraform"
    schedule:
      interval: weekly
      day: monday
      time: "07:45"
      timezone: "UTC"
    open-pull-requests-limit: 5
